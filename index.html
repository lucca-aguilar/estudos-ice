<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plano Estratégico ENE0066 — Do Fácil ao Difícil com Banco de Dados</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --border: #334155;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 20px;
        }
        h1 { color: #60a5fa; margin-bottom: 5px; }
        p.subtitle { color: var(--text-muted); }
        
        .db-controls {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 10px;
        }
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn:hover { background: var(--primary-hover); }
        .btn-success { background: var(--success); }
        .btn-success:hover { background: #059669; }

        .module-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .module-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .difficulty-badge {
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .diff-easy { background: #065f46; color: #a7f3d0; }
        .diff-medium { background: #78350f; color: #fde68a; }
        .diff-hard { background: #7f1d1d; color: #fecaca; }

        ul.task-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        ul.task-list li {
            display: flex;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px dashed rgba(255,255,255,0.05);
        }
        ul.task-list li:last-child { border-bottom: none; }
        ul.task-list label {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--success);
            cursor: pointer;
        }
        .completed span {
            text-decoration: line-through;
            color: var(--text-muted);
        }
        .progress-bar-container {
            background: var(--border);
            border-radius: 99px;
            height: 10px;
            width: 100%;
            margin-top: 10px;
            overflow: hidden;
        }
        .progress-bar {
            background: var(--success);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Plano ENE0066 — Fundamentos & Progressão Lógica</h1>
        <p class="subtitle">Organizado rigorosamente do mais fácil (essencial base) ao mais difícil (avançado).</p>
    </header>

    <!-- BARRA DE CONTROLE DO BANCO DE DADOS PERMANENTE -->
    <div class="db-controls">
        <div>
            <strong>Banco de Dados Ativo:</strong> 
            <span id="db-status" style="color: var(--success);">Salvo localmente (LocalStorage)</span>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn" onclick="exportarBanco()">Exportar Backup (JSON)</button>
            <button class="btn btn-success" onclick="document.getElementById('import-file').click()">Importar Backup</button>
            <input type="file" id="import-file" style="display: none;" onchange="importarBanco(event)">
        </div>
    </div>

    <!-- PROGRESSO GERAL -->
    <div class="module-card" style="background: #111827;">
        <h3 style="margin-top: 0;">Progresso Geral do Curso</h3>
        <div style="display: flex; justify-content: space-between; font-size: 0.9rem; color: var(--text-muted);">
            <span id="progress-text">0 de 0 tarefas concluídas</span>
            <span id="progress-percent">0%</span>
        </div>
        <div class="progress-bar-container">
            <div id="main-progress-bar" class="progress-bar"></div>
        </div>
    </div>

    <!-- MÓDULOS DO FÁCIL AO DIFÍCIL -->
    <div id="modules-container"></div>
</div>

<script>
    // ESTRUTURA DE DADOS DO CURSO (Do mais fácil / essencial ao mais difícil)
    const cursoData = [
        {
            id: "mod1",
            title: "Módulo 1: Grandezas Básicas e Lei de Ohm",
            difficulty: "Fácil (Essencial)",
            diffClass: "diff-easy",
            desc: "Pré-requisito absoluto para qualquer cálculo posterior. Foco em unidades, potências e Ohm.",
            tasks: [
                { id: "t1_1", text: "Compreender o SI, conversões de kΩ, mA, mV e mW (Listas e Aula 1)" },
                { id: "t1_2", text: "Dominar a Convenção Passiva de Sinais ($p = +vi$ vs $p = -vi$)" },
                { id: "t1_3", text: "Aplicar a Lei de Ohm ($v = Ri$), Curto-Circuito ($R=0$) e Circuito Aberto ($R\\to\\infty$)" },
                { id: "t1_4", text: "Resolver Lista 1: Exercícios básicos de potência, carga e corrente ($q, i, v, p, w$)" }
            ]
        },
        {
            id: "mod2",
            title: "Módulo 2: Topologia, Leis de Kirchhoff e Divisores",
            difficulty: "Fácil / Médio",
            diffClass: "diff-easy",
            desc: "Base de montagem de equações para redes resistivas simples.",
            tasks: [
                { id: "t2_1", text: "Identificar nós essenciais, ramos e malhas independentes" },
                { id: "t2_2", text: "Aplicar LKC (Lei de Kirchhoff das Correntes: $\\sum i_{saindo} = 0$)" },
                { id: "t2_3", text: "Aplicar LKT (Lei de Kirchhoff das Tensões: $\\sum v_k = 0$)" },
                { id: "t2_4", text: "Calcular Associações Série/Paralelo e Divisores de Tensão e Corrente" }
            ]
        },
        {
            id: "mod3",
            title: "Módulo 3: Análise Nodal (O Método Mais Útil)",
            difficulty: "Médio",
            diffClass: "diff-medium",
            desc: "Ferramenta padrão para simplificar circuitos paralelos grandes e base para Amplificadores Operacionais.",
            tasks: [
                { id: "t3_1", text: "Escolher o nó de referência (Terra, 0 V) estrategicamente" },
                { id: "t3_2", text: "Montar equações nodais padrão com condutâncias ou resistências" },
                { id: "t3_3", text: "Tratar fontes de tensão ligadas ao terra (Potencial imediato)" },
                { id: "t3_4", text: "Resolver Supernós (fontes de tensão flutuantes entre nós sem referência)" }
            ]
        },
        {
            id: "mod4",
            title: "Módulo 4: Análise de Malhas",
            difficulty: "Médio",
            diffClass: "diff-medium",
            desc: "Ferramenta complementar a Nodal, essencial para malhas fechadas e fontes de corrente.",
            tasks: [
                { id: "t4_1", text: "Definir correntes de malha independentes no sentido horário" },
                { id: "t4_2", text: "Montar equações de LKT por malha com resistências acopladas" },
                { id: "t4_3", text: "Tratar malhas periféricas com fontes de corrente independentes" },
                { id: "t4_4", text: "Resolver Supermalhas (fontes de corrente compartilhadas entre malhas)" }
            ]
        },
        {
            id: "mod5",
            title: "Módulo 5: Técnicas Avançadas — Superposição e Transformação de Fontes",
            difficulty: "Médio / Difícil",
            diffClass: "diff-medium",
            desc: "Simplificações lineares fundamentais para computar respostas parciais.",
            tasks: [
                { id: "t5_1", text: "Aplicar o Princípio da Superposição (desativar fontes independentes: Tensão=Curto, Corrente=Aberto)" },
                { id: "t5_2", text: "Realizar Transformação de Fontes ($v_s = i_s R \\leftrightarrow i_s = v_s / R$)" },
                { id: "t5_3", text: "Resolver exercícios da Lista 3 (Q1 a Q10 - Superposição)" }
            ]
        },
        {
            id: "mod6",
            title: "Módulo 6: Teoremas de Thévenin e Norton",
            difficulty: "Difícil",
            diffClass: "diff-hard",
            desc: "Isolamento de cargas complexas em dipolos simples equivalentes.",
            tasks: [
                { id: "t6_1", text: "Calcular a Tensão de Circuito Aberto $V_{Th}$ e a Corrente de Curto-Circuito $I_N$" },
                { id: "t6_2", text: "Calcular $R_{Th}$ para o Caso 1 (Apenas fontes independentes desativadas)" },
                { id: "t6_3", text: "Calcular $R_{Th}$ para o Caso 2 (Com fontes dependentes via Fonte de Teste $V_{in}/I_{in}$)" },
                { id: "t6_4", text: "Resolver Lista 3 (Q11 a Q32 - Thévenin e Norton)" }
            ]
        },
        {
            id: "mod7",
            title: "Módulo 7: Máxima Transferência de Potência",
            difficulty: "Difícil",
            diffClass: "diff-hard",
            desc: "Otimização de entrega energética para cargas resistivas.",
            tasks: [
                { id: "t7_1", text: "Comprovar a condição fundamental $R_L = R_{Th}$" },
                { id: "t7_2", text: "Calcular a potência máxima transferida $p_{max} = \\frac{V_{Th}^2}{4R_{Th}}$" },
                { id: "t7_3", text: "Resolver Lista 3 (Q33 a Q40 - Máxima Potência)" }
            ]
        },
        {
            id: "mod8",
            title: "Módulo 8: Amplificadores Operacionais (Amp-Ops Ideais)",
            difficulty: "Muito Difícil",
            diffClass: "diff-hard",
            desc: "Aplicações ativas avançadas baseadas em realimentação negativa e nós virtuais.",
            tasks: [
                { id: "t8_1", text: "Memorizar as duas regras de ouro: $v_- = v_+$ e $i_- = i_+ = 0$" },
                { id: "t8_2", text: "Analisar configurações inversora, não-inversora e somadora" },
                { id: "t8_3", text: "Resolver circuitos em cascata e híbridos (Lista 3, Q41 a Q56)" }
            ]
        }
    ];

    // BANCO DE DADOS PERMANENTE (LOCALSTORAGE)
    const STORAGE_KEY = "ene0066_database_v1";

    function carregarBanco() {
        const dadosSalvos = localStorage.getItem(STORAGE_KEY);
        if (dadosSalvos) {
            try {
                return JSON.parse(dadosSalvos);
            } catch (e) {
                console.error("Erro ao carregar banco de dados", e);
            }
        }
        return {}; // Retorna objeto vazio se não houver dados
    }

    function salvarBanco(dados) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(dados));
        atualizarInterfaceProgresso();
    }

    // RENDERIZAR A INTERFACE
    function renderizarApp() {
        const container = document.getElementById("modules-container");
        const db = carregarBanco();
        container.innerHTML = "";

        let totalTarefas = 0;
        let tarefasConcluidas = 0;

        cursoData.forEach(mod => {
            let modConcluidas = 0;
            let taskListHTML = "";

            mod.tasks.forEach(task => {
                totalTarefas++;
                const isChecked = db[task.id] === true;
                if (isChecked) {
                    modConcluidas++;
                    tarefasConcluidas++;
                }

                taskListHTML += `
                    <li>
                        <label class="${isChecked ? 'completed' : ''}">
                            <input type="checkbox" id="${task.id}" ${isChecked ? 'checked' : ''} onchange="toggleTask('${task.id}')">
                            <span>${task.text}</span>
                        </label>
                    </li>
                `;
            });

            const card = document.createElement("div");
            card.className = "module-card";
            card.innerHTML = `
                <div class="module-header">
                    <div>
                        <h3 style="margin:0 0 5px 0;">${mod.title}</h3>
                        <p style="margin:0; font-size: 0.85rem; color: var(--text-muted);">${mod.desc}</p>
                    </div>
                    <span class="difficulty-badge ${mod.diffClass}">${mod.difficulty}</span>
                </div>
                <ul class="task-list">
                    ${taskListHTML}
                </li>
            `;
            container.appendChild(card);
        });

        // Atualizar barra geral
        const percentual = totalTarefas > 0 ? Math.round((tarefasConcluidas / totalTarefas) * 100) : 0;
        document.getElementById("progress-text").innerText = `${tarefasConcluidas} de ${totalTarefas} tarefas concluídas`;
        document.getElementById("progress-percent").innerText = `${percentual}%`;
        document.getElementById("main-progress-bar").style.width = `${percentual}%`;
    }

    function toggleTask(taskId) {
        const db = carregarBanco();
        const checkbox = document.getElementById(taskId);
        db[taskId] = checkbox.checked;
        salvarBanco(db);
        renderizarApp();
    }

    // FUNÇÕES DE BACKUP / EXPORTAÇÃO E IMPORTAÇÃO DO BANCO PERMANENTE
    function exportarBanco() {
        const db = carregarBanco();
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `backup_ene0066_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    function importarBanco(event) {
        const fileReader = new FileReader();
        if (event.target.files[0]) {
            fileReader.readAsText(event.target.files[0], "UTF-8");
            fileReader.onload = (e) => {
                try {
                    const importedData = JSON.parse(e.target.result);
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(importedData));
                    renderizarApp();
                    alert("Banco de dados importado e restaurado com sucesso!");
                } catch (error) {
                    alert("Erro ao ler o arquivo JSON de backup.");
                }
            };
        }
    }

    function atualizarInterfaceProgresso() {
        // Gatilho auxiliar se necessário
    }

    // Inicializar na carga da página
    window.onload = renderizarApp;
</script>

</body>
</html>
